name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Google Play version code, larger than every previous upload
        required: true
        default: '1'
      version_name:
        description: Public app version
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/android-ci.yml

  signed-release:
    name: Build and verify signed APK and AAB
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      YANDEX_BANNER_ID: ${{ vars.YANDEX_BANNER_ID }}
      UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Set up Android SDK and API 36 build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Set the ephemeral upload key path
        run: printf 'UPLOAD_KEYSTORE_FILE=%s/packing-list-upload.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Load protected signing material
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64" && test -n "$UPLOAD_STORE_PASSWORD" && test -n "$UPLOAD_KEY_ALIAS" && test -n "$UPLOAD_KEY_PASSWORD"
          [[ "$YANDEX_BANNER_ID" =~ ^R-M-[0-9]+-[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$UPLOAD_KEYSTORE_FILE"
      - name: Lint release, build signed APK and Play bundle
        run: ./gradlew --no-daemon --max-workers=2 :app:lintRelease :app:assembleRelease :app:bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Verify exact certificate, package, SDK and 16 KB alignment
        run: bash scripts/verify-release.sh
      - name: Save verified release and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: release-output/
          if-no-files-found: error
          retention-days: 90
      - name: Save release lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-lint-reports
          path: app/build/reports/lint-results-release.*
          retention-days: 90
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$UPLOAD_KEYSTORE_FILE"
